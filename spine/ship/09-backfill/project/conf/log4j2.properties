# Spark's own log messages: warnings and errors only, one line each
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.alwaysWriteExceptions = false
appender.console.layout.pattern = %p %c{1}: %replace{%m}{(?s)\n.*}{}%n
# Hadoop's native-library notice is not about your job
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
# A restarted streaming query reloads its state: normal, and logged per partition
logger.statestore.name = org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
logger.statestore.level = error
